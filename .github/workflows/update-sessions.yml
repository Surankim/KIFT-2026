name: Update KIFT Sessions (8/8 Email)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run session update script
        run: python3 update_sessions.py

      - name: Commit and push changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "KIFT Update Bot"
          git add index.html
          git diff --cached --stat
          git commit -m "Update sessions per Daniel 8/8 email: S2 title, Audrey Hansen, Sunghoon->S2, Sang-Goo Lee, Maisa Benatti"
          git push
